nodeDriver:
  url: ""
  checksum: ""
  whitelistDomains: []
uiPlugin:
  endpoint: ""
placement:
  enabled: true
  ledgerName: pve-placement-ledger
  initialLedgerNamespace: fleet-default
  initialClusterID: ""
  authorization:
    deploymentName: pve-placement-authorizer
    serviceAccountName: pve-placement-authorizer
    clusterRoleName: pve-placement-authorizer
    clusterRoleBindingName: pve-placement-authorizer
    reconcileIntervalSeconds: 2
    image:
      repository: ghcr.io/edorid/pve-placement-authorizer
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi
  inventoryAPI:
    enabled: true
    allowedProxmoxHosts: []
    serviceName: pve-placement-inventory
    apiServiceName: v1alpha1.inventory.pve.edorid.github.io
    certificateName: pve-placement-inventory
    servingIssuerName: pve-placement-inventory-ca
    selfSignedIssuerName: pve-placement-inventory-selfsigned
    caCertificateName: pve-placement-inventory-ca
